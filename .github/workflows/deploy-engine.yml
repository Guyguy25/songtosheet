name: Deploy engine (Modal)

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-engine.yml"]
  workflow_dispatch:
    inputs:
      benchmark_url:
        description: "Lien YouTube pour mesurer le temps et le coût réels (optionnel)"
        required: false
      benchmark:
        description: "Mesure à lancer : benchmark (piano) ou benchmark_yourmt3 (précision YourMT3+)"
        required: false
        default: benchmark

concurrency:
  group: deploy-engine
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal
        run: pip install modal "fastapi[standard]>=0.115,<1"
      - name: Deploy
        run: modal deploy backend/modal_app.py
      - name: Benchmark
        if: ${{ github.event.inputs.benchmark_url != '' }}
        env:
          BENCHMARK_URL: ${{ github.event.inputs.benchmark_url }}
          BENCHMARK: ${{ github.event.inputs.benchmark || 'benchmark' }}
        run: |
          case "$BENCHMARK" in benchmark|benchmark_yourmt3) ;; *) echo "Mesure inconnue"; exit 1;; esac
          modal run "backend/modal_app.py::$BENCHMARK" --url "$BENCHMARK_URL"
