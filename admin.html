<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tableau de bord KPI · Tablurio</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
<style>
:root{--ink:#1e1533;--muted:#6f6585;--line:#ebe5f5;--bg:#f6f4fb;--card:#fff;--purple:#6d3ddc;--purple-soft:#efe8ff;--green:#14966a;--green-soft:#e2f6ee;--amber:#b86e00;--amber-soft:#fff2dc;
  --s1:#6d3ddc;--s2:#e0791f;--s3:#1a9e74;--s4:#2f6fd6;--s5:#d6427a;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}a{color:var(--purple)}
main{max-width:1240px;margin:0 auto;padding:28px 22px 70px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.kicker{font-size:11px;font-weight:850;letter-spacing:.14em;color:var(--purple);text-transform:uppercase}
h1{margin:6px 0 4px;font-size:clamp(28px,4vw,40px);letter-spacing:-.045em}
.sub{margin:0;color:var(--muted);font-size:14px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;padding:4px;background:#fff;border:1px solid var(--line);border-radius:12px}
.chips button{border:0;background:none;padding:8px 12px;border-radius:9px;font:inherit;font-size:13px;font-weight:750;color:var(--muted);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--purple);color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:750;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--purple)}
.state{margin-top:24px;padding:28px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.learn-kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin-top:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;min-width:0}
.kpi span{display:block;font-size:12px;font-weight:750;color:var(--muted)}
.kpi b{display:block;margin:6px 0 4px;font-size:30px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.kpi.accent{background:linear-gradient(140deg,#2a1f45,#4a2f8c);border-color:transparent;color:#fff}
.kpi.accent span,.kpi.accent small{color:#cfc3ef}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;margin-top:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;min-width:0}
.panel h2{margin:0 0 3px;font-size:17px;letter-spacing:-.02em}
.panel>p{margin:0 0 14px;color:var(--muted);font-size:13px}
.funnel{display:grid;gap:9px}
.step{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.step .label{font-size:13.5px;font-weight:700;min-width:0}
.step .num{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.step .track{grid-column:1/-1;height:10px;border-radius:6px;background:#f1edf8;overflow:hidden}
.step .fill{height:100%;border-radius:6px;background:var(--purple)}
.step .rate{grid-column:1/-1;font-size:12px;color:var(--muted)}
.drop{color:#b4361f;font-weight:750}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg text{font-family:inherit}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:750;color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--purple-soft);border-color:#d6c7fb;color:var(--purple)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #f3eff9;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:block;height:5px;margin-top:5px;border-radius:3px;background:#f1edf8;max-width:160px}
.bar span{display:block;height:100%;border-radius:3px;background:var(--purple)}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.pill.free{background:#f1edf8;color:var(--muted)}.pill.starter{background:var(--amber-soft);color:var(--amber)}.pill.pro,.pill.lifetime{background:var(--green-soft);color:var(--green)}
.email{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted)}
.links{display:grid;gap:8px}
.link-row{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#faf8fe;min-width:0}
.link-row code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.link-row label{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.builder{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.builder input{flex:1;min-width:160px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13px}
.full{grid-column:1/-1}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.ret-kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin-top:4px}
.dist{display:grid;gap:7px}
.dist-row{display:grid;grid-template-columns:44px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px;font-weight:750}
.dist-row .track{height:12px;border-radius:6px;background:#f1edf8;overflow:hidden}
.dist-row .fill{height:100%;border-radius:6px;background:#ffb938}
.dist-row.low .fill{background:#ff8a5c}
.dist-row .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.reasons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.reasons h3{margin:0 0 8px;font-size:13px}
.reasons ul{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:12.5px}
.reasons li{display:flex;justify-content:space-between;gap:8px;padding:6px 9px;border-radius:9px;background:#faf8fe}
.reasons li b{font-variant-numeric:tabular-nums}
.stars{color:#f09d00;letter-spacing:1px;white-space:nowrap}.stars.low{color:#e5612e}
.tags{display:flex;flex-wrap:wrap;gap:4px}.tags span{padding:2px 7px;border-radius:999px;background:var(--purple-soft);color:var(--purple);font-size:11px;font-weight:750}
.comment{max-width:320px;font-size:12.5px;line-height:1.4}
.split{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:18px}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;margin:18px -22px 0;padding:10px 22px;background:rgba(246,244,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid transparent}
.nav.stuck{border-bottom-color:var(--line)}
.nav a{flex:none;padding:8px 12px;border-radius:10px;color:var(--muted);font-size:13px;font-weight:750;text-decoration:none;white-space:nowrap}
.nav a:hover{background:#fff;color:var(--ink)}.nav a.on{background:#fff;color:var(--purple);box-shadow:0 1px 4px rgba(40,20,90,.07)}
.nav a small{margin-left:5px;padding:1px 6px;border-radius:999px;background:var(--purple-soft);color:var(--purple);font-size:11px}
.section{scroll-margin-top:64px;margin-top:30px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.section-head h2{margin:0;font-size:22px;letter-spacing:-.035em}
.section-head p{margin:0;color:var(--muted);font-size:13px}
.section>.kpis:first-of-type{margin-top:0}
.stack{display:grid;gap:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;font:inherit;font-size:13px;background:#fff}
.toolbar select{padding:9px 10px;border:1px solid var(--line);border-radius:11px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:750;color:var(--muted);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--purple-soft);border-color:#d6c7fb;color:var(--purple)}
.filters button b{margin-left:4px;font-variant-numeric:tabular-nums}
.more{display:flex;justify-content:center;margin-top:12px}
.count{font-size:12px;color:var(--muted);margin-left:auto}
.sub-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
td .line2{font-size:12px;color:var(--muted);margin-top:2px}
.contact a{font-size:12px}

.tunnel-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:14px}
.tun{display:grid;gap:0}
.tun-row{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;align-items:center;gap:14px;padding:6px 0}
.tun-name{font-size:14px;font-weight:800}
.tun-name small{display:block;font-size:11.5px;font-weight:650;color:var(--muted);margin-top:2px}
.tun-bar{position:relative;height:46px;display:flex;justify-content:center}
.tun-bar span{display:flex;align-items:center;justify-content:center;min-width:46px;height:100%;border-radius:12px;background:var(--purple);color:#fff;font-size:15px;font-weight:850;font-variant-numeric:tabular-nums;transition:width .3s}
.tun-row.video .tun-bar span{background:#2a1f45}
.tun-row.paid .tun-bar span{background:var(--green)}
.tun-row.muted .tun-bar span{background:#cfc6e3;color:#4a3f60}
.tun-rate{font-size:22px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tun-rate small{display:block;font-size:11.5px;font-weight:650;color:var(--muted);letter-spacing:0}
.tun-drop{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:14px;font-size:12px;color:var(--muted)}
.tun-drop div{text-align:center;padding:3px 0;border-left:2px dashed #e3dcf0;margin-left:50%;padding-left:10px;text-align:left}
.tun-drop.leak div{color:#b4361f;font-weight:800;border-left-color:#f2b3a3}
.tun-input{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tun-input select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
.tun-input input{width:150px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13px}
.tun-input label{font-size:13px;font-weight:750}
.tun-input small{font-size:12px;color:var(--muted)}
.ret-box{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:13px}
.facts li{padding:10px 12px;border-radius:12px;background:#faf8fe;line-height:1.45}
.facts b{font-variant-numeric:tabular-nums}
.rate-cell{display:block;font-size:11px;color:var(--muted)}
@media(max-width:980px){.tunnel-wrap{grid-template-columns:1fr}.tun-row,.tun-drop{grid-template-columns:96px minmax(0,1fr) 92px;gap:8px}}
@media(max-width:980px){.sub-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:980px){.ret-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.reasons{grid-template-columns:1fr}}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
@media(max-width:520px){.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <span class="kicker">Admin · Tablurio</span>
      <h1>Tableau de bord KPI</h1>
      <p class="sub" id="sub">Chargement…</p>
    </div>
    <div class="controls">
      <div class="chips" role="group" aria-label="Période">
        <button type="button" data-days="1">24 h</button><button type="button" data-days="7">7 j</button><button type="button" data-days="30" aria-pressed="true">30 j</button><button type="button" data-days="90">90 j</button><button type="button" data-days="365">1 an</button>
      </div>
      <button type="button" class="btn" id="refresh">↻ Actualiser</button>
      <a class="btn" href="/app">← Mon espace</a>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="Sections">
    <a href="#apercu">Vue d’ensemble</a><a href="#tunnel">Tunnel</a><a href="#utilisateurs">Utilisateurs<small id="nav-users">–</small></a><a href="#sons">Sons<small id="nav-songs">–</small></a>
    <a href="#retours">Retours & notes</a><a href="#acquisition">Acquisition</a><a href="#jeu">Mode jeu</a><a href="#liens">Liens</a>
  </nav>
  <div id="content"></div>
</main>
<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id);
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const nf=new Intl.NumberFormat('fr-FR');
  const num=value=>nf.format(value||0);
  const pct=value=>`${String(value||0).replace('.',',')} %`;
  let regions=null;try{regions=new Intl.DisplayNames(['fr'],{type:'region'});}catch{}
  const flag=code=>/^[A-Z]{2}$/.test(code)?String.fromCodePoint(...[...code].map(c=>0x1F1E6+c.charCodeAt(0)-65)):'🌐';
  const country=code=>code&&code!=='??'?`${flag(code)} ${esc(regions?.of(code)||code)}`:'Inconnu';
  const CHANNELS={organic:'🔎 Recherche (Google, Bing…)',ai:'🤖 Assistants IA (ChatGPT, Perplexity…)',social:'📱 Réseaux sociaux',direct:'↩ Direct',referral:'🔗 Autres sites'};
  const SOURCES={direct:'Direct (lien tapé, favori, appli sans info)',tiktok:'TikTok',instagram:'Instagram',meta:'Facebook / Meta (non précisé)',youtube:'YouTube',google:'Google',x:'X / Twitter',bing:'Bing',reddit:'Reddit',whop:'Whop',chatgpt:'ChatGPT'};
  const label=(field,key)=>{
    if(field==='country')return country(key);
    if(field==='source')return esc(SOURCES[key]||key);
    if(field==='channel')return esc(CHANNELS[key]||key);
    if(field==='content')return key==='—'||!key?'<span class="muted">Sans vidéo précisée</span>':esc(key);
    return esc(key);
  };
  const date=value=>new Date(value).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  // Période gardée dans l'adresse (?jours=) et dans le navigateur : « Actualiser » ou F5 restent sur la même période.
  const PERIODS=[1,7,30,90,365];
  const savedDays=()=>{
    const fromUrl=Number(new URLSearchParams(location.search).get('jours'));
    if(PERIODS.includes(fromUrl))return fromUrl;
    try{const stored=Number(localStorage.getItem('tb_admin_days'));if(PERIODS.includes(stored))return stored;}catch{}
    return 30;
  };
  let days=savedDays(),data=null,tab='channel';
  const userView={query:'',filter:'all',sort:'created',shown:50};
  const videosKey=()=>'tb_admin_videos_'+days;
  function setDays(value){
    days=value;
    try{localStorage.setItem('tb_admin_days',String(value));}catch{}
    const url=new URL(location.href);url.searchParams.set('jours',String(value));history.replaceState(null,'',url);
    document.querySelectorAll('[data-days]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.days)===value)));
  }
  setDays(days);

  async function load(){
    $('sub').textContent='Chargement…';
    try{
      const response=await fetch(`/api/admin/stats?days=${days}`,{credentials:'same-origin'});
      if(response.status===403||response.status===401){
        $('content').innerHTML='<div class="state">Ce tableau de bord est réservé au compte admin. <a href="/connexion">Connecte-toi</a> avec ton compte administrateur.</div>';
        $('sub').textContent='Accès refusé';return;
      }
      if(!response.ok)throw new Error();
      data=await response.json();
      render();
    }catch{
      $('content').innerHTML='<div class="state">Les statistiques n’ont pas pu être chargées. Réessaie dans un instant.</div>';
      $('sub').textContent='Erreur de chargement';
    }
  }

  function kpi(title,value,detail,accent){
    return `<div class="kpi${accent?' accent':''}"><span>${title}</span><b>${value}</b><small>${detail}</small></div>`;
  }

  function chart(series){
    const keys=[['visitors','Visiteurs','var(--s1)'],['signups','Inscriptions','var(--s2)'],['previews','Aperçus','var(--s3)'],['full','Morceaux entiers','var(--s4)'],['returns','Comptes revenus','var(--s5)']];
    const W=620,H=210,L=34,B=24,T=10;
    const max=Math.max(1,...series.flatMap(row=>keys.map(([k])=>row[k])));
    const nice=Math.max(1,Math.ceil(max/4))*4;
    const x=i=>L+(series.length===1?(W-L)/2:i*(W-L-10)/(series.length-1));
    const y=v=>T+(H-T-B)*(1-v/nice);
    const grid=[0,.25,.5,.75,1].map(f=>{const v=Math.round(nice*f);return `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#eee9f6"/><text x="${L-6}" y="${y(v)+4}" font-size="10" fill="#8b81a0" text-anchor="end">${v}</text>`;}).join('');
    const every=Math.max(1,Math.ceil(series.length/8));
    const ticks=series.map((row,i)=>i%every===0||i===series.length-1?`<text x="${x(i)}" y="${H-6}" font-size="10" fill="#8b81a0" text-anchor="middle">${row.day.slice(8,10)}/${row.day.slice(5,7)}</text>`:'').join('');
    const lines=keys.map(([k,,color])=>{
      const pts=series.map((row,i)=>`${x(i).toFixed(1)},${y(row[k]).toFixed(1)}`).join(' ');
      const dots=series.length<=31?series.map((row,i)=>row[k]?`<circle cx="${x(i)}" cy="${y(row[k])}" r="2.6" fill="${color}"><title>${row.day} · ${row[k]}</title></circle>`:'').join(''):'';
      return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
    }).join('');
    return `<div class="legend">${keys.map(([,name,color])=>`<span><i style="background:${color}"></i>${name}</span>`).join('')}</div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Évolution jour par jour">${grid}${ticks}${lines}</svg>`;
  }

  function funnel(steps){
    const top=Math.max(1,steps[0].value);
    return `<div class="funnel">${steps.map((step,index)=>`
      <div class="step"><span class="label">${esc(step.label)}</span><span class="num">${num(step.value)}</span>
        <div class="track"><div class="fill" style="width:${Math.max(step.value?2:0,step.value/top*100)}%;opacity:${1-index*.11}"></div></div>
        <span class="rate">${index?`${pct(step.rate_from_previous)} de l’étape précédente · ${pct(step.rate_from_visit)} des visiteurs`:'Point de départ'}${index&&steps[index-1].value>step.value?` · <span class="drop">−${num(steps[index-1].value-step.value)}</span>`:''}</span></div>`).join('')}</div>`;
  }

  const TABS=[['channel','Canal'],['source','Source'],['content','Vidéo / lien'],['device','Appareil'],['country','Pays'],['os','Système'],['browser','Navigateur'],['landing','Page d’arrivée']];
  function breakdown(){
    const rows=data.breakdowns[tab]||[];
    const top=Math.max(1,...rows.map(r=>r.visitors));
    return `<div class="tabs" role="tablist">${TABS.map(([key,name])=>`<button type="button" role="tab" data-tab="${key}" aria-selected="${key===tab}">${name}</button>`).join('')}</div>
      <div class="table-wrap"><table><thead><tr><th>${esc(TABS.find(([k])=>k===tab)[1])}</th><th class="n">Visiteurs</th><th class="n">Aperçus</th><th class="n">Inscrits</th><th class="n">Taux d’inscription</th><th class="n">Payants</th></tr></thead><tbody>

  const PLAN={free:'Gratuit',starter:'Starter',pro:'Pro',lifetime:'Lifetime'};
  const starText=score=>`<span class="stars${score<=2?' low':''}" title="${score} / 5">${'★'.repeat(score)}${'☆'.repeat(5-score)}</span>`;
  function returning(r,ratings){
    const rated=ratings||{count:0,average:0,answer_rate:0,dismissed:0,distribution:[0,0,0,0,0],reasons:{low:{},mid:{},high:{}},recent:[],labels:null};
    const total=Math.max(1,...rated.distribution);
    const reasonList=bucket=>{
      const entries=Object.entries(rated.reasons[bucket]||{}).sort((a,b)=>b[1]-a[1]);
      const names=rated.labels?.[bucket]?.reasons||{};
      return entries.length?`<ul>${entries.map(([id,n])=>`<li><span>${esc(names[id]?.fr||id)}</span><b>${num(n)}</b></li>`).join('')}</ul>`:'<p class="muted" style="margin:0;font-size:12.5px">Aucune réponse.</p>';
    };
    const reasonName=(score,id)=>{const bucket=score<=2?'low':score===3?'mid':'high';return rated.labels?.[bucket]?.reasons?.[id]?.fr||id;};
    return `<div class="kpis ret-kpis">
        ${kpi('Comptes revenus',num(r.returning),`Revenus sur la période un autre jour que leur inscription · ${num(r.returning_days)} jours de retour`)}
        ${kpi('Revenus le lendemain',pct(r.d1),`${num(r.d1_back)} sur ${num(r.d1_cohort)} inscrits de la période (J+1)`)}
        ${kpi('Revenus sous 7 jours',pct(r.d7),`${num(r.d7_back)} sur ${num(r.d7_cohort)} inscrits d’au moins 7 jours`)}
        ${kpi('Pop-ups affichées',num(rated.shown||0),`${pct(rated.answer_rate)} ont noté · ${num(rated.dismissed)} fermées sans note`)}
        ${kpi('Note moyenne',rated.count?`${String(rated.average).replace('.',',')} / 5`:'—',rated.count?`Sur ${num(rated.count)} générations notées`:'Pas encore de note sur la période',true)}
      </div>
      ${r.tracked_since?'<p class="note">Les jours de passage sont enregistrés depuis la mise en ligne de ce suivi : les chiffres de retour se remplissent à partir de maintenant.</p>':''}
      <div class="panel" style="margin-top:14px"><div class="split">
        <div><h3 style="margin:0 0 10px;font-size:14px">Répartition des notes</h3><div class="dist">${[5,4,3,2,1].map(score=>`<div class="dist-row${score<=2?' low':''}"><span>${score} ★</span><div class="track"><div class="fill" style="width:${rated.distribution[score-1]/total*100}%"></div></div><span class="n">${num(rated.distribution[score-1])}</span></div>`).join('')}</div></div>
        <div><h3 style="margin:0 0 10px;font-size:14px">Pourquoi cette note</h3><div class="reasons" style="margin-top:0">
          <div><h3>😣 Notes 1-2 · ce qui n’a pas marché</h3>${reasonList('low')}</div>
          <div><h3>🙂 Note 3 · ce qui manquait</h3>${reasonList('mid')}</div>
          <div><h3>🤩 Notes 4-5 · ce qui a plu</h3>${reasonList('high')}</div></div></div>
      </div></div>
      <div class="panel" style="margin-top:14px"><h2>Dernières notes</h2><p>La note, les raisons cochées et le commentaire, génération par génération.</p>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Compte</th><th>Morceau</th><th>Note</th><th>Pourquoi</th><th>Commentaire</th></tr></thead><tbody>
        ${rated.recent.length?rated.recent.map(x=>`<tr><td class="muted">${date(x.at)}</td><td><div class="email">${esc(x.account)}</div></td>
          <td><div class="email" style="max-width:240px" title="${esc(x.title)}">${esc(x.title)}</div><div class="muted">${esc(INSTRUMENTS[x.instrument]||x.instrument)} · ${x.kind==='full'?'Morceau entier':'Aperçu 30 s'}</div></td>
          <td>${starText(x.score)}</td><td><div class="tags">${x.reasons.map(id=>`<span>${esc(reasonName(x.score,id))}</span>`).join('')||'<span class="muted" style="background:none;padding:0">—</span>'}</div></td>
          <td><div class="comment">${x.comment?esc(x.comment):'<span class="muted">—</span>'}</div></td></tr>`).join('')
          :'<tr><td colspan="6" class="muted">Aucune note sur cette période.</td></tr>'}
      </tbody></table></div></div>
      <div class="panel" style="margin-top:14px"><h2>Derniers comptes revenus</h2><p>Comptes revenus un autre jour que celui de leur inscription.</p>
      <div class="table-wrap"><table><thead><tr><th>Compte</th><th>Inscrit le</th><th>Dernier passage</th><th class="n">Jours de retour</th><th class="n">Générations</th><th>Dernier morceau</th><th>Offre</th></tr></thead><tbody>
        ${r.list.length?r.list.map(x=>`<tr><td><div class="email" title="${esc(x.email)}">${esc(x.pseudo||x.email)}</div>${x.pseudo?`<div class="email muted">${esc(x.email)}</div>`:''}</td>
          <td class="muted">${date(x.created_at)}</td><td>${x.last_seen_at?date(x.last_seen_at):'—'}</td><td class="n">${num(x.return_days)}</td><td class="n">${num(x.generations)}</td>
          <td><div class="email" style="max-width:220px">${esc(x.last_job||'—')}</div></td><td><span class="pill ${esc(x.plan)}">${esc(PLAN[x.plan]||x.plan)}</span></td></tr>`).join('')
          :'<tr><td colspan="7" class="muted">Personne n’est encore revenu sur cette période.</td></tr>'}
      </tbody></table></div></div>`;
  }

  // ---- Onglet Tunnel : Vidéos → Landing → A généré → Compte → Paywall → Paiement, puis rétention ----
  const tunnelSteps=()=>data.tunnel.all;
  function tunnelSection(){
    const t=data.tunnel;
    let videos='';try{videos=localStorage.getItem(videosKey())||'';}catch{}
    const r=t.retention;
    const pages=t.landing_pages||{};
    return `<div class="tunnel-wrap">
      <div class="panel">
        <div class="tun-input">
          <label for="tunnel-videos">Vues des vidéos</label><input id="tunnel-videos" type="number" min="0" inputmode="numeric" placeholder="ex. 100000" value="${esc(videos)}">
          <small>À recopier depuis TikTok / Instagram pour la période (gardé dans ton navigateur).</small>
        </div>
        <div id="tunnel-chart"></div>
      </div>
      <div class="stack">
        <div class="panel"><h2>Rétention des payants</h2><p>Abonnés toujours actifs après leur premier paiement (depuis le début).</p>
          <div class="ret-box">${kpi('M1',r.m1_cohort?pct(r.m1):'—',r.m1_cohort?`${num(r.m1_kept)} sur ${num(r.m1_cohort)} payants d’au moins 1 mois`:'Aucun payant d’au moins 1 mois')}
          ${kpi('M3',r.m3_cohort?pct(r.m3):'—',r.m3_cohort?`${num(r.m3_kept)} sur ${num(r.m3_cohort)} payants d’au moins 3 mois`:'Aucun payant d’au moins 3 mois')}</div></div>
        <div class="panel"><h2>Où arrivent les gens</h2><p>Première page vue sur le site.</p><ul class="facts">
          <li>Page d’accueil : <b>${num(pages.accueil||0)}</b></li><li>Pages outils (SEO) : <b>${num(pages.outils||0)}</b></li>
          <li>Articles « Apprendre » : <b>${num(pages.articles||0)}</b></li><li>Autres pages (app, tarifs, connexion…) : <b>${num(pages.autre||0)}</b></li>${pages.inconnue?`<li>Inconnue (navigateur qui bloque le suivi) : <b>${num(pages.inconnue)}</b></li>`:''}</ul></div>
        <div class="panel" id="tunnel-facts"></div>
      </div></div>
      <div class="panel" style="margin-top:14px"><h2>Tunnel par source</h2><p>Mêmes étapes, source par source. Le taux sous chaque nombre suit la même règle que le tunnel.</p>
      <div class="table-wrap"><table><thead><tr><th>Source</th><th class="n">Landing</th><th class="n">Ont généré</th><th class="n">Comptes</th><th class="n">Paywall vu</th><th class="n">Paiements</th><th class="n">Landing → paiement</th></tr></thead><tbody>
      ${t.sources.length?t.sources.map(x=>`<tr><td>${x.key==='direct'?'Direct':label('source',x.key)}</td><td class="n">${num(x.landing)}</td>
        <td class="n">${num(x.generated)}<span class="rate-cell">${pct(x.generated_rate)} de la landing</span></td>
        <td class="n">${num(x.account)}<span class="rate-cell">${pct(x.account_rate)} de la landing</span></td>
        <td class="n">${num(x.paywall)}<span class="rate-cell">${pct(x.paywall_rate)} des comptes</span></td>
        <td class="n">${num(x.paid)}<span class="rate-cell">${pct(x.paid_rate)} du paywall</span></td>
        <td class="n">${pct(x.overall_rate)}</td></tr>`).join('')
        :'<tr><td colspan="7" class="muted">Pas encore de visiteur sur cette période.</td></tr>'}
      </tbody></table></div></div>`;
  }
  function paintTunnel(){
    const st=tunnelSteps();
    const videos=Number($('tunnel-videos')?.value)||0;
    const rows=[
      ...(videos?[{key:'video',name:'Vidéos',sub:'Vues saisies',value:videos,rate:null}]:[]),
      {key:'landing',name:'Landing',sub:`${num(st.engaged)} ont interagi${st.earlier||st.untracked?` · dont ${num((st.earlier||0)+(st.untracked||0))} inscrits venus avant ou sans suivi`:''}`,value:st.landing,rate:videos?{v:videos?st.landing/videos*100:0,of:'des vues'}:null},
      {key:'generated',name:'A généré un son',sub:'Aperçu ou morceau lancé',value:st.generated,rate:{v:st.generated_rate,of:'de la landing'},muted:true},
      {key:'account',name:'Compte',sub:'Inscription',value:st.account,rate:{v:st.account_rate,of:'de la landing'}},
      {key:'paywall',name:'Paywall',sub:'Tarifs ou « Débloquer » vus',value:st.paywall,rate:{v:st.paywall_rate,of:'des comptes'}},
      {key:'paid',name:'Paiement',sub:`${num(st.checkout)} ont cliqué sur Payer`,value:st.paid,rate:{v:st.paid_rate,of:'du paywall'}}
    ];
    // Les parts qui partent entre deux étapes principales (A généré est une étape à côté, pas dans la chaîne).
    const chain=rows.filter(row=>row.key!=='generated');
    const drops=new Map();
    chain.forEach((row,i)=>{if(i){const prev=chain[i-1];drops.set(row.key,{lost:Math.max(0,prev.value-row.value),share:prev.value?(prev.value-row.value)/prev.value*100:0});}});
    const worst=[...drops.entries()].filter(([key])=>key!=='landing').sort((a,b)=>b[1].share-a[1].share)[0]?.[0];
    // Largeurs relatives à la landing (les vues vidéo, bien plus grandes, gardent la barre pleine).
    const top=Math.max(1,st.landing);
    const width=(v,key)=>key==='video'?100:v?Math.max(8,Math.min(1,Math.sqrt(v/top))*(videos?82:100)):8;
    const rateText=v=>`${String(Math.round(v*10)/10).replace('.',',')} %`;
    $('tunnel-chart').innerHTML=`<div class="tun">${rows.map(row=>{
      const drop=drops.get(row.key);
      const dropLine=drop&&row.key!=='generated'?`<div class="tun-drop${row.key===worst&&drop.lost?' leak':''}"><span></span><div>↓ ${num(drop.lost)} partis (${rateText(drop.share)})${row.key===worst&&drop.lost?' · plus grosse fuite':''}</div><span></span></div>`:'';
      return `${dropLine}<div class="tun-row ${row.key}${row.muted?' muted':''}"><div class="tun-name">${row.name}<small>${row.sub}</small></div>
        <div class="tun-bar"><span style="width:${width(row.value,row.key)}%">${num(row.value)}</span></div>
        <div class="tun-rate">${row.rate?rateText(row.rate.v):'—'}<small>${row.rate?row.rate.of:'point de départ'}</small></div></div>`;
    }).join('')}</div>
    <p class="note">Chaque personne est comptée une fois, robots exclus. Les étapes s’emboîtent : le paywall ne compte que les personnes qui ont créé un compte, le paiement celles qui ont vu le paywall. « A généré un son » est mesuré à côté (on peut créer son compte avant ou après).</p>`;
    $('tunnel-facts').innerHTML=`<h2>À retenir</h2><p>Sur la période.</p><ul class="facts">
      <li><b>${num(st.generated_without_account)}</b> ont généré un son sans créer de compte.</li>
      <li><b>${num(st.account_without_generation)}</b> ont créé un compte sans jamais générer.</li>
      <li><b>${num(Math.max(0,st.account-st.paywall))}</b> comptes n’ont jamais vu le paywall.</li>
      <li><b>${num(Math.max(0,st.checkout-st.paid))}</b> ont cliqué sur Payer sans finaliser.</li>
      <li>De la landing au paiement : <b>${pct(st.overall_rate)}</b>.</li></ul>`;
  }

  const PLAN_LABEL={free:'Gratuit',starter:'Starter',pro:'Pro',lifetime:'Lifetime'};
  const ago=value=>{
    if(!value)return '—';
    const minutes=Math.round((Date.now()-new Date(value))/60000);
    if(minutes<60)return `il y a ${Math.max(1,minutes)} min`;
    if(minutes<1440)return `il y a ${Math.round(minutes/60)} h`;
    const d=Math.round(minutes/1440);return d===1?'hier':`il y a ${d} j`;
  };
  const USER_FILTERS=[
    ['all','Tous',()=>true],
    ['period','Inscrits sur la période',u=>new Date(u.created_at)>=new Date(data.since)],
    ['paying','Payants',u=>u.plan!=='free'],
    ['back','Revenus',u=>u.return_days>0],
    ['generated','Ont généré',u=>u.previews+u.full>0],
    ['never','Jamais généré',u=>u.previews+u.full===0],
    ['phone','Avec téléphone',u=>Boolean(u.phone)]
  ];
  const USER_SORTS={created:['Inscription la plus récente',u=>-new Date(u.created_at||0)],seen:['Passage le plus récent',u=>-new Date(u.last_seen_at||0)],
    gens:['Le plus de générations',u=>-(u.previews+u.full)],plays:['Le plus d’écoutes',u=>-u.plays],back:['Le plus de retours',u=>-u.return_days]};
  function usersSection(){
    return `<div class="panel"><div class="toolbar">
        <input type="search" id="user-search" placeholder="Chercher un email, un pseudo, un téléphone, un morceau…" value="${esc(userView.query)}" aria-label="Chercher un utilisateur">
        <select id="user-sort" aria-label="Trier">${Object.entries(USER_SORTS).map(([key,[name]])=>`<option value="${key}"${key===userView.sort?' selected':''}>${name}</option>`).join('')}</select>

  }
  function paintUsers(){
    const all=data.users||[];
    const q=userView.query.trim().toLowerCase();
    const match=u=>!q||[u.email,u.pseudo,u.phone,u.last_job,u.source,u.content].some(value=>String(value||'').toLowerCase().includes(q));
    $('user-filters').innerHTML=USER_FILTERS.map(([key,name,test])=>`<button type="button" data-user-filter="${key}" aria-pressed="${key===userView.filter}">${name}<b>${num(all.filter(test).length)}</b></button>`).join('');
    const test=USER_FILTERS.find(([key])=>key===userView.filter)[2];

      ${shown.length?shown.map(u=>`<tr>
        <td><div class="email" title="${esc(u.email)}">${esc(u.pseudo||u.email)}</div>${u.pseudo?`<div class="email line2">${esc(u.email)}</div>`:''}
          ${u.phone?`<div class="contact line2"><a href="tel:${esc(u.phone)}">${esc(u.phone)}</a> · <a href="https://wa.me/${esc(u.phone.replace(/\D/g,''))}" target="_blank" rel="noopener">WhatsApp</a>${u.consent?' · <span class="pill pro">Accord</span>':''}</div>`:''}</td>
        <td class="muted">${date(u.created_at)}</td>
        <td>${u.source==='direct'?'Direct':label('source',u.source)}${u.content?`<div class="line2">${esc(u.content)}</div>`:''}<div class="line2">${[u.device,u.country?country(u.country):''].filter(Boolean).join(' · ')}</div></td>
        <td><span class="pill ${esc(u.plan)}">${esc(PLAN_LABEL[u.plan]||u.plan)}</span></td>
        <td class="n">${num(u.previews)}</td><td class="n">${num(u.full)}</td><td class="n">${num(u.plays)}</td>
        <td>${u.last_job_at?`<div class="email" style="max-width:220px" title="${esc(u.last_job)}">${esc(u.last_job||'Sans titre')}</div><div class="line2">${ago(u.last_job_at)}</div>`:'<span class="muted">—</span>'}</td>
        <td>${u.last_seen_at?`${ago(u.last_seen_at)}`:'<span class="muted">—</span>'}</td>
        <td class="n">${u.return_days?num(u.return_days):'<span class="muted">0</span>'}</td>
        <td>${u.rating!=null?`${starText(Math.round(u.rating))}<div class="line2">${String(u.rating).replace('.',',')} · ${num(u.rated)} note${u.rated>1?'s':''}</div>`:'<span class="muted">—</span>'}</td></tr>`).join('')
        :'<tr><td colspan="11" class="muted">Aucun utilisateur ne correspond.</td></tr>'}
      </tbody></table></div>
      <div class="more"><span class="count">${num(shown.length)} affichés sur ${num(rows.length)}</span>${rows.length>shown.length?'<button type="button" class="btn" id="users-more" style="margin-left:12px">Afficher 100 de plus</button>':''}</div>`;
  }

  function sounds(){
    const p=data.plays||{plays:0,listeners:0,songs:0,recent:[]};
    const k=data.kpis;
    return `<div class="kpis sub-kpis">
        ${kpi('Écoutes',num(p.plays),'Appuis sur lecture depuis l’écran partition')}
        ${kpi('Personnes qui écoutent',num(p.listeners),'Comptes ayant écouté au moins un morceau')}

        ${kpi('Générations',num(k.previews+k.full_songs),`${num(k.previews)} aperçus · ${num(k.full_songs)} morceaux entiers`,true)}
      </div>
      <div class="panel" style="margin-top:14px"><h2>Sons écoutés récemment</h2><p>Une ligne par compte, morceau et jour, la plus récente en haut. Ton compte admin est exclu.</p>
      <div class="table-wrap"><table><thead><tr><th>Quand</th><th>Morceau</th><th>Instrument</th><th>Type</th><th>Compte</th><th class="n">Lectures</th></tr></thead><tbody>
        ${p.recent.length?p.recent.map(r=>`<tr><td class="muted" title="${esc(date(r.at))}">${ago(r.at)}</td>
          <td><div class="email" style="max-width:320px" title="${esc(r.title)}">${r.youtube_id?`<a href="https://www.youtube.com/watch?v=${esc(r.youtube_id)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}</div></td>
          <td>${esc(INSTRUMENTS[r.instrument]||r.instrument||'—')}</td><td>${r.kind==='full'?'Morceau entier':'Aperçu 30 s'}</td>
          <td><div class="email">${esc(r.account)}</div></td><td class="n">${num(r.count)}</td></tr>`).join('')
          :'<tr><td colspan="6" class="muted">Aucune écoute enregistrée sur cette période. Les écoutes sont comptées depuis la mise en ligne de ce suivi.</td></tr>'}
      </tbody></table></div></div>
      <div class="panel" style="margin-top:14px"><h2>Dernières générations</h2><p>Par instrument, puis une par une.</p>${instruments(data.instruments||[])}${generations(data.generations||[])}</div>`;
  }

  function links(){
    const base=location.origin;
    const bio=`${base}/tt`,ig=`${base}/ig`;
    return `<div class="links"><div class="link-row"><label>Bio TikTok</label><code>${esc(bio)}</code><button type="button" class="btn" data-copy="${esc(bio)}">Copier</button></div>
      <div class="link-row"><label>Bio Instagram</label><code>${esc(ig)}</code><button type="button" class="btn" data-copy="${esc(ig)}">Copier</button></div></div>
      <div class="builder"><select id="video-network" class="btn"><option value="tiktok">TikTok</option><option value="instagram">Instagram</option></select><input id="video-name" placeholder="Nom de la vidéo, ex. rehab-piano" maxlength="50"><button type="button" class="btn" id="make-link">Créer un lien pour cette vidéo</button></div>
      <div class="links" id="made-link" style="margin-top:8px"></div>
      <p class="note">Chaque lien apparaît ensuite dans l’onglet « Vidéo / lien ». Depuis l’appli TikTok, même l’adresse simple tablurio.com est reconnue. Pour Instagram, mets plutôt /ig : son navigateur ressemble parfois à celui de Facebook.</p>`;
  }

  function render(){
    const k=data.kpis;
    $('sub').textContent=`${days===1?'Dernières 24 h':`${days} derniers jours`} · mis à jour à ${new Date(data.generated_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})} · ton compte admin est exclu`;
    $('content').innerHTML=`
      <section class="section" id="apercu" style="margin-top:6px">
      <div class="kpis">
        ${kpi('Visiteurs réels',num(k.visitors),`${num(k.bots)} robots filtrés (aucune interaction)`)}
        ${kpi('Inscriptions',num(k.signups),`${pct(k.visit_to_signup)} des visiteurs · ${num(k.total_users)} comptes au total`)}
        ${kpi('Recherche (SEO)',num(k.organic_visitors||0),`${num(k.organic_signups||0)} inscriptions venues de Google, Bing… · ${num(k.ai_visitors||0)} visiteurs venus d’assistants IA`)}
        ${kpi('Aperçus lancés',num(k.previews),`${num(k.guest_previews)} sans compte · ${num(k.failed_previews)} en échec`)}
        ${kpi('Morceaux entiers',num(k.full_songs),`${num(k.cached)} servis depuis le cache`)}
        ${kpi('Utilisateurs actifs',num(k.active_users),'Comptes ayant généré sur la période')}
        ${kpi('Activation',pct(k.activation),'Des nouveaux inscrits ont lancé une génération')}
        ${kpi('Abonnés payants',num(k.paying),`${num(k.starter)} Starter · ${num(k.pro)} Pro · ${num(k.lifetime)} Lifetime · ${num(k.new_paying)} nouveaux`)}
        ${kpi('Revenu mensuel estimé',`${num(k.mrr)} €`,`Prix mensuels pleins · inscrit → payant : ${pct(k.signup_to_paid)}`,true)}
      </div>
      <div class="grid">
        <section class="panel"><h2>Entonnoir de conversion</h2><p>Des visiteurs arrivés sur la période, combien sont allés jusqu’à chaque étape.</p>${funnel(data.funnel)}</section>
        <section class="panel"><h2>Jour par jour</h2><p>Visiteurs réels, inscriptions, générations et comptes revenus.</p>${chart(data.series)}</section>
      </div></section>
      <section class="section" id="tunnel"><div class="section-head"><h2>Tunnel</h2><p>Combien de personnes arrivent, jusqu’où elles vont, et où elles partent.</p></div>${data.tunnel?tunnelSection():'<div class="state">Pas encore de donnée.</div>'}</section>
      <section class="section" id="utilisateurs"><div class="section-head"><h2>Utilisateurs</h2><p>Tous les comptes depuis le début, avec leur activité. Recherche, filtres et tri.</p></div>${usersSection()}</section>
      <section class="section" id="sons"><div class="section-head"><h2>Sons</h2><p>Ce qui est écouté et généré sur la période.</p></div>${sounds()}</section>
      <section class="section" id="retours"><div class="section-head"><h2>Retours & notes</h2><p>Qui revient un autre jour, et la note donnée via la pop-up de retour. <a href="/app?noter" target="_blank" rel="noopener">Voir la pop-up ↗</a></p></div>
        ${data.returning?returning(data.returning,data.ratings):''}</section>
      <section class="section" id="acquisition"><div class="section-head"><h2>Acquisition</h2><p>D’où viennent les visiteurs, et ce qu’ils font.</p></div>
        <div class="panel" id="breakdown">${breakdown()}</div></section>
      <section class="section" id="jeu"><div class="section-head"><h2>Mode jeu</h2><p>Joueurs et niveaux terminés sur la période.</p></div>
        ${data.learn?`
          <div class="kpis learn-kpis">
            ${kpi('Joueurs',num(data.learn.players),'Comptes ayant terminé au moins un niveau')}
            ${kpi('Niveaux terminés',num(data.learn.levels_done),'Avec étoiles ou validés sans micro')}
            ${kpi('Morceaux joués',num(data.learn.songs),'Morceaux ouverts en mode jeu avec un niveau terminé')}
            ${kpi('Part au micro',pct(Math.round(data.learn.mic_share*100)),'Niveaux réussis en jouant au micro')}
            ${kpi('Clics « Débloquer »',num(data.learn.unlock_clicks),'Depuis la carte du jeu (comptes gratuits)',true)}
          </div>`:'<div class="state">Pas encore de donnée.</div>'}</section>
      <section class="section" id="liens"><div class="section-head"><h2>Liens à suivre</h2><p>Mets ces liens dans ta bio ou sous tes vidéos pour savoir lesquelles ramènent du monde.</p></div><div class="panel">${links()}</div></section>`;
    $('nav-users').textContent=num((data.users||[]).length);
    $('nav-songs').textContent=num(data.plays?.plays||0);
    if(data.tunnel){
      paintTunnel();
      $('tunnel-videos').addEventListener('input',event=>{try{localStorage.setItem(videosKey(),event.target.value);}catch{}paintTunnel();});
    }
    paintUsers();
    $('user-search').addEventListener('input',event=>{userView.query=event.target.value;userView.shown=50;paintUsers();});
    $('user-sort').addEventListener('change',event=>{userView.sort=event.target.value;paintUsers();});
    if(location.hash&&!render.scrolled){render.scrolled=true;document.querySelector(location.hash)?.scrollIntoView();}
  }

  document.addEventListener('click',async event=>{
    const chip=event.target.closest('[data-days]');
    if(chip){setDays(Number(chip.dataset.days));load();return;}
    const filterButton=event.target.closest('[data-user-filter]');
    if(filterButton&&data){userView.filter=filterButton.dataset.userFilter;userView.shown=50;paintUsers();return;}
    if(event.target.closest('#users-more')&&data){userView.shown+=100;paintUsers();return;}
    const tabButton=event.target.closest('[data-tab]');
    if(tabButton&&data){tab=tabButton.dataset.tab;$('breakdown').innerHTML=breakdown();return;}
    if(event.target.closest('#refresh')){load();return;}
    const copy=event.target.closest('[data-copy]');
    if(copy){try{await navigator.clipboard.writeText(copy.dataset.copy);copy.textContent='Copié ✓';setTimeout(()=>copy.textContent='Copier',1600);}catch{}return;}
    if(event.target.closest('#make-link')){
      const name=$('video-name').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50);
      if(!name)return;
      const url=`${location.origin}/?utm_source=${$('video-network').value}&utm_medium=video&utm_content=${name}`;
      $('made-link').innerHTML=`<div class="link-row"><label>${esc(name)}</label><code>${esc(url)}</code><button type="button" class="btn" data-copy="${esc(url)}">Copier</button></div>`;
    }
  });
  // Section visible surlignée dans la barre du haut.
  const navLinks=[...document.querySelectorAll('#nav a')];
  addEventListener('scroll',()=>{
    $('nav').classList.toggle('stuck',$('nav').getBoundingClientRect().top<=0);
    let current=null;
    for(const link of navLinks){const target=document.querySelector(link.getAttribute('href'));if(target&&target.getBoundingClientRect().top<120)current=link;}
    navLinks.forEach(link=>link.classList.toggle('on',link===current));
  },{passive:true});
  load();
})();
</script>
</body>
</html>
