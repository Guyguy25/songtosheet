<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Comparatif guitare · SongToSheet</title>
  <link rel="icon" href="/assets/favicon.svg">
  <style>
    :root{font-family:system-ui,sans-serif;color:#20192f;background:#f6f5fa;accent-color:#7040dc}
    body{margin:0}
    main{max-width:1140px;margin:auto;padding:32px 20px 60px}
    a{color:#5e31be}
    h1{margin:14px 0 8px;font-size:clamp(1.8rem,5vw,3rem)}
    h2,p{margin:0 0 12px}
    .panel,article{background:#fff;border:1px solid #e7dff0;border-radius:16px;padding:18px;margin-top:18px;min-width:0}
    .transport,.versions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .versions{margin-bottom:14px}
    button{font:inherit;font-weight:600;padding:8px 13px;border:1px solid #ded4ee;background:#fff;color:inherit;border-radius:9px;cursor:pointer}
    button[aria-pressed="true"],#play{background:#6236cc;color:#fff;border-color:#6236cc}
    #seek{flex:1;min-width:120px}
    #position{font-variant-numeric:tabular-nums}
    .scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
    .scores article:has([aria-current="true"]){border-color:#7040dc}
    object{width:100%;height:430px;margin-top:12px;border-radius:8px;background:#faf9fc}
    #status,#hint{color:#554969}
    [hidden]{display:none!important}
    @media(max-width:720px){.scores{grid-template-columns:1fr}object{height:350px}}
  </style>
  <script src="/assets/guitar-comparison.js?v=2" defer></script>
</head>
<body>
  <main>
    <a href="/app">← Mon espace SongToSheet</a>
    <h1>Comparatif guitare</h1>
    <p id="status" role="status">Vérification de ta session…</p>
    <section id="import" class="panel" hidden>
      <label for="comparison-file"><strong>Ouvrir un fichier de comparaison</strong></label>
      <p>Le fichier est lu dans ton navigateur.</p>
      <input id="comparison-file" type="file" accept=".json,application/json">
    </section>
    <section id="comparison" aria-labelledby="comparison-title" hidden>
      <div class="panel">
        <h2 id="comparison-title"></h2>
        <p id="hint">Le curseur est commun. Change de version pendant la lecture pour entendre la différence au même moment.</p>
        <div id="comparison-versions" class="versions" role="group" aria-label="Version à écouter"></div>
        <div class="transport">
          <button id="play" type="button">Lire</button>
          <input id="seek" type="range" min="0" max="20" step="0.01" value="0" aria-label="Position de lecture commune">
          <output id="position" for="seek">0:00</output>
        </div>
      </div>
      <div id="comparison-scores" class="scores"></div>
    </section>
  </main>
</body>
</html>
