<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Version imprimable — Tablurio.com</title>
<style>
  @page{size:A4;margin:12mm}
  *{box-sizing:border-box}
  body{margin:0;background:#f4f2f9;color:#17151e;font-family:Inter,Arial,sans-serif}
  .bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:14px 20px;background:#fff;border-bottom:1px solid #e8e0f9}
  .bar strong{font-size:15px}
  .bar span{flex:1;color:#6b5f86;font-size:13.5px}
  .bar button{border:0;border-radius:10px;padding:10px 16px;background:#7549eb;color:#fff;font:600 14px Inter,Arial,sans-serif;cursor:pointer}
  .bar button:disabled{opacity:.5;cursor:default}
  main{max-width:210mm;margin:24px auto;padding:14mm 12mm;background:#fff;box-shadow:0 10px 40px rgba(64,37,140,.12)}
  header h1{margin:0 0 2mm;font-size:17pt}
  header p{margin:0 0 6mm;color:#555;font-size:10pt}
  #status{color:#6b5f86}
  #sheet svg{display:block;max-width:100%;height:auto}
  @media print{
    body{background:#fff}
    .bar{display:none}
    main{margin:0;padding:0;max-width:none;box-shadow:none}
    main>header{display:none}
    #sheet svg{width:100%;break-inside:avoid;break-after:page}
    #sheet svg:last-child{break-after:auto}
  }
</style>
</head>
<body>
<div class="bar"><strong>Version imprimable</strong><span id="hint">Préparation de la partition…</span><button id="print" type="button" disabled>Enregistrer en PDF</button></div>
<main>
  <header><h1 id="title">Partition</h1><p id="meta">Relevé automatique · Tablurio.com</p></header>
  <p id="status">Chargement…</p>
  <div id="sheet"></div>
</main>
<script>
(async()=>{
  'use strict';
  const params=new URLSearchParams(location.search);
  const id=params.get('id')||'';
  const status=document.getElementById('status'),button=document.getElementById('print');
  const fail=message=>{status.textContent=message;document.getElementById('hint').textContent='';};
  if(!/^[a-f0-9]{24}$/i.test(id))return fail('Lien invalide.');
  try{
    const job=await fetch('/api/jobs/'+id,{credentials:'same-origin'}).then(r=>r.ok?r.json():Promise.reject(new Error(r.status===401?'Connecte-toi pour imprimer ta partition.':'Partition introuvable.')));
    const tab=job.format==='tablature'&&job.downloads?.includes('tab');
    const kind=tab?'tab':'musicxml';
    if(!job.downloads?.includes(kind))throw new Error('Cette partition n’a pas encore de version imprimable.');
    document.title=`${job.title} — Version imprimable`;
    document.getElementById('title').textContent=job.title;
    document.getElementById('meta').textContent=`${tab?'Tablature':'Partition'} · ${job.instrument.charAt(0).toUpperCase()+job.instrument.slice(1)} · Relevé automatique · Tablurio.com`;
    const [xml]=await Promise.all([
      fetch(`/api/track?id=${id}&download=${kind}`,{credentials:'same-origin'}).then(r=>r.ok?r.text():Promise.reject(new Error('Partition indisponible.'))),
      new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='/api/player-assets?asset=score&v=2.3.0';s.onload=resolve;s.onerror=()=>reject(new Error('Mise en page indisponible.'));document.head.append(s);})
    ]);
    const display=new window.opensheetmusicdisplay.OpenSheetMusicDisplay(document.getElementById('sheet'),{
      backend:'svg',autoResize:false,drawTitle:true,drawSubtitle:false,drawComposer:false,drawCredits:false,pageFormat:'A4_P',pageBackgroundColor:'#FFFFFF'});
    await display.load(xml);
    display.Zoom=.8;
    display.render();
    status.remove();
    button.disabled=false;
    document.getElementById('hint').textContent='Dans la fenêtre d’impression, choisis « Enregistrer au format PDF ».';
    button.onclick=()=>window.print();
    if(params.get('auto')==='1')setTimeout(()=>window.print(),300);
  }catch(error){fail(error.message||'Mise en page impossible.');}
})();
</script>
</body>
</html>
